<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Profil — Survai</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;--card:#141416;--border:#27272A;
  --accent:#00E599;--heading:#FFFFFF;--body:#A1A1AA;--muted:#71717A;
  --radius:14px;--nav-h:64px;
}
[data-theme='light']{
  --bg:#FAFAFA;--card:#FFFFFF;--border:#E4E4E7;
  --accent:#00C07B;--accent-dim:#00C07B1A;
  --heading:#18181B;--body:#63636E;--muted:#A1A1AA;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--body);
  min-height:100vh;display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.app{
  width:100%;max-width:430px;min-height:100vh;
  position:relative;padding-bottom:calc(var(--nav-h) + 24px);
}

/* ── Header ── */
.header{
  padding:14px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.header h1{font-size:18px;font-weight:600;color:var(--heading);letter-spacing:-.2px}
.header-btn{
  background:none;border:none;cursor:pointer;padding:4px;
  color:var(--muted);display:flex;align-items:center;justify-content:center;
  transition:color .15s;
}
.header-btn:hover{color:var(--heading)}

/* ── Profile Card ── */
.profile-card{
  margin:20px 20px 0;padding:28px 20px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  text-align:center;
}
.avatar{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#00b377);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;font-size:28px;font-weight:700;color:var(--bg);
  box-shadow:0 0 24px rgba(0,229,153,.18);
}
[data-theme='light'] .avatar{
  box-shadow:0 0 24px rgba(0,192,123,.18);
}
.profile-name{font-size:20px;font-weight:700;color:var(--heading);margin-bottom:4px}
.profile-email{font-size:13px;color:var(--muted);margin-bottom:6px}
.profile-role{
  display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;
  background:rgba(0,229,153,.1);color:var(--accent);border:1px solid rgba(0,229,153,.2);
}
[data-theme='light'] .profile-role{
  background:rgba(0,192,123,.1);border:1px solid rgba(0,192,123,.2);
}

/* ── Stats Row ── */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  margin:16px 20px 0;
}
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 12px;text-align:center;
}
.stat-value{font-size:20px;font-weight:700;color:var(--heading);line-height:1}
.stat-label{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px}


/* ── Sync Section ── */
.sync-section{margin:16px 20px 0}
.sync-btn{
  width:100%;padding:14px;border:1px solid rgba(0,229,153,.4);
  border-radius:var(--radius);background:rgba(0,229,153,.08);
  color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .2s;
}
.sync-btn:hover{background:rgba(0,229,153,.15);box-shadow:0 0 20px rgba(0,229,153,.12)}
.sync-btn:active{transform:scale(.98)}
.sync-btn:disabled{opacity:.6;cursor:not-allowed}
.sync-btn svg{width:18px;height:18px}
.sync-btn.syncing svg{animation:spin .9s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
[data-theme='light'] .sync-btn{background:rgba(0,192,123,.08);border-color:rgba(0,192,123,.4)}

/* Sync Progress Bar */
.sync-progress{margin-top:12px;max-height:0;overflow:hidden;opacity:0;transition:all .3s ease}
.sync-progress.active{max-height:60px;opacity:1}
.sync-progress-track{
  height:6px;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:99px;overflow:hidden;
}
[data-theme='light'] .sync-progress-track{background:rgba(0,0,0,.04)}
.sync-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),#00b377);
  border-radius:99px;
  transition:width .4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px rgba(0,229,153,.5);
}
.sync-progress-info{
  display:flex;justify-content:space-between;align-items:center;margin-top:8px;
}
.sync-progress-status{font-size:12px;color:var(--muted)}
.sync-progress-percent{font-size:12px;font-weight:700;color:var(--accent)}

/* ── Settings Section ── */
.section-title{
  font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;padding:20px 20px 10px;
}
.settings{
  margin:0 20px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.settings-item{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;cursor:pointer;transition:background .15s;
  border-bottom:1px solid var(--border);
}
.settings-item:last-child{border-bottom:none}
.settings-item:hover{background:rgba(255,255,255,.03)}
.settings-item:active{background:rgba(255,255,255,.06)}
[data-theme='light'] .settings-item:hover{background:rgba(0,0,0,.03)}
[data-theme='light'] .settings-item:active{background:rgba(0,0,0,.06)}
.settings-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.settings-icon svg{width:18px;height:18px}
.settings-icon.green{background:rgba(0,229,153,.1)}
.settings-icon.green svg{color:var(--accent)}
.settings-icon.blue{background:rgba(96,165,250,.1)}
.settings-icon.blue svg{color:#60A5FA}
.settings-icon.purple{background:rgba(192,132,252,.1)}
.settings-icon.purple svg{color:#C084FC}
.settings-icon.amber{background:rgba(251,191,36,.1)}
.settings-icon.amber svg{color:#FBBF24}
[data-theme='light'] .settings-icon.green{background:rgba(0,192,123,.1)}
.settings-text{flex:1}
.settings-text span{display:block;font-size:14px;font-weight:500;color:var(--heading)}
.settings-text small{font-size:12px;color:var(--muted)}
.settings-arrow{color:var(--muted);flex-shrink:0}
.settings-arrow svg{width:16px;height:16px}

/* ── Logout Button ── */
.logout-wrap{margin:20px 20px 0}
.logout-btn{
  width:100%;padding:15px;border:1px solid rgba(239,68,68,.3);
  border-radius:var(--radius);background:rgba(239,68,68,.08);
  color:#EF4444;font-size:15px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .2s;
}
.logout-btn:hover{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5)}
.logout-btn:active{background:rgba(239,68,68,.22);transform:scale(.98)}
.logout-btn svg{width:18px;height:18px}

/* ── Bottom Nav ── */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;height:var(--nav-h);
  background:#111113;border-top:1px solid var(--border);
  display:flex;
  padding:0 8px;padding-bottom:env(safe-area-inset-bottom,0);
  z-index:100;
}
[data-theme='light'] .bottom-nav{
  background:#FFFFFF;
}
.nav-item{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;
  color:var(--muted);font-size:10px;font-weight:500;
  flex:1;
}
.nav-item svg{width:22px;height:22px;color:var(--muted);transition:color .2s}
.nav-item span{font-size:10px;font-weight:600;color:var(--muted);transition:color .2s}
.nav-item.active svg{color:var(--accent)}
.nav-item.active span{color:var(--accent)}
.nav-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.nav-item:not(.active):hover svg{color:var(--body)}
.nav-item:not(.active):hover span{color:var(--body)}

/* ── Toast Notification System ── */
.toast-container{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  width:calc(100% - 40px);max-width:390px;z-index:9999;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:12px;
  background:rgba(20,20,22,.95);backdrop-filter:blur(12px);
  border:1px solid;pointer-events:all;
  animation:toastIn .35s cubic-bezier(.22,1,.36,1) forwards;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
[data-theme='light'] .toast{
  background:rgba(255,255,255,.95);
  box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.toast.removing{animation:toastOut .3s ease forwards}
.toast-icon{width:20px;height:20px;flex-shrink:0}
.toast-msg{flex:1;font-size:13px;font-weight:500;color:var(--heading);line-height:1.4}

/* Toast Types */
.toast.success{border-color:rgba(0,229,153,.4);box-shadow:0 0 20px rgba(0,229,153,.12),0 8px 32px rgba(0,0,0,.4)}
.toast.success .toast-icon svg{color:#00E599}
.toast.info{border-color:rgba(96,165,250,.4);box-shadow:0 0 20px rgba(96,165,250,.12),0 8px 32px rgba(0,0,0,.4)}
.toast.info .toast-icon svg{color:#60A5FA}
.toast.warning{border-color:rgba(251,191,36,.4);box-shadow:0 0 20px rgba(251,191,36,.12),0 8px 32px rgba(0,0,0,.4)}
.toast.warning .toast-icon svg{color:#FBBF24}
.toast.danger{border-color:rgba(239,68,68,.4);box-shadow:0 0 20px rgba(239,68,68,.12),0 8px 32px rgba(0,0,0,.4)}
.toast.danger .toast-icon svg{color:#EF4444}

@keyframes toastIn{
  from{opacity:0;transform:translateY(-16px) scale(.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes toastOut{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(-10px) scale(.95)}
}
</style>
</head>

<script>
// ── Toast Notification System ──
const toastIcons = {
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  danger:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
};

function showToast(message, type = 'info', duration = 3000) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <div class="toast-icon">${toastIcons[type] || toastIcons.info}</div>
    <div class="toast-msg">${message}</div>
  `;
  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}


// ── Sync Handler ──
let isSyncing = false;
function startSync() {
  if (isSyncing) return;
  isSyncing = true;

  const btn = document.getElementById('syncBtn');
  const btnText = document.getElementById('syncBtnText');
  const progress = document.getElementById('syncProgress');
  const fill = document.getElementById('syncFill');
  const status = document.getElementById('syncStatus');
  const percent = document.getElementById('syncPercent');

  btn.classList.add('syncing');
  btn.disabled = true;
  btnText.textContent = 'Menyinkronkan...';
  progress.classList.add('active');
  fill.style.width = '0%';

  const stages = [
    { at: 0,   label: 'Menghubungkan ke server...' },
    { at: 25,  label: 'Mengunduh data survei...' },
    { at: 55,  label: 'Memproses respons...' },
    { at: 80,  label: 'Menyinkronkan statistik...' }
  ];

  let val = 0;
  const tick = setInterval(() => {
    val += Math.random() * 9 + 3;
    if (val >= 100) {
      val = 100;
      clearInterval(tick);
      fill.style.width = '100%';
      percent.textContent = '100%';
      status.textContent = 'Selesai!';
      setTimeout(() => {
        btn.classList.remove('syncing');
        btn.disabled = false;
        btnText.textContent = 'Sinkronkan Data';
        showToast('Data berhasil disinkronkan', 'success', 3000);
        setTimeout(() => {
          progress.classList.remove('active');
          setTimeout(() => {
            fill.style.width = '0%';
            percent.textContent = '0%';
            status.textContent = 'Memulai...';
            isSyncing = false;
          }, 300);
        }, 1500);
      }, 400);
      return;
    }
    fill.style.width = val + '%';
    percent.textContent = Math.round(val) + '%';
    for (let i = stages.length - 1; i >= 0; i--) {
      if (val >= stages[i].at) { status.textContent = stages[i].label; break; }
    }
  }, 220);
}

// ── Logout Handler ──
function handleLogout() {
  showToast('Berhasil logout', 'success', 2000);
  setTimeout(() => {
    window.location.href = 'login.html';
  }, 1500);
}

// ── Theme Toggle ──
(function(){
  const KEY='survai_theme';
  const darkIcon=document.getElementById('themeIconDark');
  const lightIcon=document.getElementById('themeIconLight');
  const btn=document.getElementById('themeToggle');

  function setTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    localStorage.setItem(KEY,t);
    darkIcon.style.display=t==='dark'?'':'none';
    lightIcon.style.display=t==='light'?'':'none';
  }

  // Apply saved theme on load (default dark)
  setTheme(localStorage.getItem(KEY)||'dark');

  btn.addEventListener('click',function(){
    const current=document.documentElement.getAttribute('data-theme')||'dark';
    setTheme(current==='dark'?'light':'dark');
  });
})();
</script>
