<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Survai — Log In</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0b;
    --card:      #141416;
    --border:    #27272A;
    --accent:    #00E599;
    --accent-dim:#00E59926;
    --heading:   #FFFFFF;
    --body:      #A1A1AA;
    --muted:     #71717A;
    --danger:    #EF4444;
    --radius:    10px;
    --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  [data-theme='light'] {
    --bg:        #FAFAFA;
    --card:      #FFFFFF;
    --border:    #E4E4E7;
    --accent:    #00C07B;
    --accent-dim:#00C07B1A;
    --heading:   #18181B;
    --body:      #63636E;
    --muted:     #A1A1AA;
    --danger:    #DC2626;
  }

  [data-theme='light'] .input-wrap input {
    background: #F4F4F5;
    color: #18181B;
  }

  [data-theme='light'] .toast {
    background: #FFFFFF;
    color: #18181B;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }

  [data-theme='light'] .wordmark h1 {
    color: #18181B;
  }

  [data-theme='light'] .field-error {
    color: #DC2626;
  }

  [data-theme='light'] body {
    background: #FAFAFA;
  }

  [data-theme='light'] .footer {
    color: #A1A1AA;
  }

  [data-theme='light'] .links a {
    color: #63636E;
  }

  html { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--body);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px env(safe-area-inset-bottom, 0);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    width: 100%;
    max-width: 430px;
  }

  /* ── Wordmark ── */
  .wordmark {
    text-align: center;
    margin-bottom: 40px;
    user-select: none;
  }

  .wordmark svg {
    width: 36px;
    height: 36px;
    margin-bottom: 12px;
  }

  .wordmark h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--heading);
    letter-spacing: -0.3px;
  }

  .wordmark p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.01em;
  }

  /* ── Card ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
  }

  /* ── Form ── */
  .field { margin-bottom: 20px; }
  .field:last-of-type { margin-bottom: 24px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--body);
    margin-bottom: 8px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap svg.icon {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--muted);
    pointer-events: none;
    transition: color 0.2s ease;
  }

  .input-wrap input {
    width: 100%;
    height: 48px;
    padding: 0 14px 0 42px;
    font-family: var(--font);
    font-size: 15px;
    color: var(--heading);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-wrap input::placeholder {
    color: var(--muted);
    font-size: 14px;
  }

  .input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .input-wrap input:focus ~ svg.icon {
    color: var(--accent);
  }

  .toggle-password {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--muted);
    transition: color 0.15s ease;
  }

  .toggle-password:hover { color: var(--body); }
  .toggle-password svg { width: 18px; height: 18px; display: block; }

  /* ── Button ── */
  .btn-login {
    width: 100%;
    height: 48px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    color: #0a0a0b;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-login:hover { box-shadow: 0 4px 20px #00E59940; }

  .btn-login:active {
    transform: scale(0.98);
    opacity: 0.9;
  }

  .btn-login:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn-login::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.4s ease;
    pointer-events: none;
  }

  .btn-login:hover::after { left: 100%; }

  .btn-login .spinner {
    display: none;
    width: 20px; height: 20px;
    border: 2px solid rgba(10,10,11,0.25);
    border-top-color: #0a0a0b;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin: 0 auto;
    vertical-align: middle;
  }

  .btn-login.loading .btn-text { display: none; }
  .btn-login.loading .spinner  { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Links row ── */
  .links {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    font-size: 13px;
  }

  .links a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .links a:hover { color: var(--body); }
  .links a:active { color: var(--accent); }

  /* ── Footer ── */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--card);
    color: var(--heading);
    font-size: 13px;
    font-weight: 500;
    padding: 14px 18px;
    border-radius: 12px;
    opacity: 0;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .toast.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast .toast-icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
  }

  .toast .toast-icon svg {
    width: 100%;
    height: 100%;
  }

  /* Toast type: success */
  .toast.success {
    border: 1.5px solid #00E599;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 12px #00E59940, inset 0 0 12px #00E59910;
  }
  .toast.success .toast-icon svg { stroke: #00E599; fill: none; }

  /* Toast type: info */
  .toast.info {
    border: 1.5px solid #38BDF8;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 12px #38BDF840, inset 0 0 12px #38BDF810;
  }
  .toast.info .toast-icon svg { stroke: #38BDF8; fill: none; }

  /* Toast type: warning */
  .toast.warning {
    border: 1.5px solid #FBBF24;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 12px #FBBF2440, inset 0 0 12px #FBBF2410;
  }
  .toast.warning .toast-icon svg { stroke: #FBBF24; fill: none; }

  /* Toast type: danger */
  .toast.danger {
    border: 1.5px solid #EF4444;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 12px #EF444440, inset 0 0 12px #EF444410;
  }
  .toast.danger .toast-icon svg { stroke: #EF4444; fill: none; }

  @keyframes toastPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* ── Field error ── */
  .field-error {
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
    display: none;
  }

  .field.has-error input {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px #EF444420;
  }

  .field.has-error .field-error { display: block; }

  /* ── Theme Toggle ── */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--body);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
  }

  .theme-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .theme-toggle:active { transform: scale(0.95); }

  .theme-toggle svg {
    width: 18px;
    height: 18px;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .theme-toggle .icon-sun,
  .theme-toggle .icon-moon {
    position: absolute;
  }

  .theme-toggle .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.5); }
  .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }

  [data-theme='light'] .theme-toggle .icon-sun  { opacity: 1; transform: rotate(0deg) scale(1); }
  [data-theme='light'] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }
</style>
</head>
<body>

<!-- Theme Toggle -->
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
</button>

<div class="container">
  <!-- Wordmark -->
  <div class="wordmark">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="2" y="2" width="32" height="32" rx="8" fill="#00E599"/>
      <path d="M10 24V12l4 7 4-7v12" stroke="#0a0a0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="26" cy="18" r="4" stroke="#0a0a0b" stroke-width="2.5"/>
    </svg>
    <h1>Survai</h1>
    <p>Field survey platform</p>
  </div>

  <!-- Login Card -->
  <div class="card">
    <form id="loginForm" novalidate autocomplete="on">

      <div class="field" id="emailField">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <path d="M22 7l-10 6L2 7"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
        </div>
        <div class="field-error" id="emailError">Enter a valid email address</div>
      </div>

      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="3"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePw" aria-label="Toggle password visibility">
            <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div class="field-error" id="passwordError">Password is required</div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span class="btn-text">Log In</span>
        <span class="spinner"></span>
      </button>

      <div class="links">
        <a href="#" id="forgotLink">Forgot password?</a>
        <a href="#" id="createLink">Create account</a>
      </div>

    </form>
  </div>

  <div class="footer">
    Survai v1.0 &middot; field data collection
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// Theme toggle (runs early to prevent flash)
(function () {
  var saved = localStorage.getItem('survai_theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FAFAFA');
  }
})();

(function () {
  'use strict';

  var form       = document.getElementById('loginForm');
  var email      = document.getElementById('email');
  var password   = document.getElementById('password');
  var btnLogin   = document.getElementById('btnLogin');
  var togglePw   = document.getElementById('togglePw');
  var eyeOpen    = document.getElementById('eyeOpen');
  var eyeClosed  = document.getElementById('eyeClosed');
  var emailField    = document.getElementById('emailField');
  var passwordField = document.getElementById('passwordField');
  var toastEl    = document.getElementById('toast');

  // Theme toggle button
  var themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', function () {
    var html = document.documentElement;
    var isLight = html.getAttribute('data-theme') === 'light';
    if (isLight) {
      html.removeAttribute('data-theme');
      localStorage.setItem('survai_theme', 'dark');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0b');
    } else {
      html.setAttribute('data-theme', 'light');
      localStorage.setItem('survai_theme', 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FAFAFA');
    }
  });

  // Password visibility toggle
  var pwVisible = false;
  togglePw.addEventListener('click', function () {
    pwVisible = !pwVisible;
    password.type = pwVisible ? 'text' : 'password';
    eyeOpen.style.display   = pwVisible ? 'none'  : 'block';
    eyeClosed.style.display = pwVisible ? 'block' : 'none';
  });

  // Clear field error on input
  email.addEventListener('input', function () { emailField.classList.remove('has-error'); });
  password.addEventListener('input', function () { passwordField.classList.remove('has-error'); });

  // Toast icons
  var toastIcons = {
    success: '<svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    info: '<svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    warning: '<svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    danger: '<svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
  };

  // Toast helper
  var toastTimer;
  function showToast(msg, type) {
    type = type || 'info';
    clearTimeout(toastTimer);
    toastEl.className = 'toast ' + type;
    toastEl.innerHTML = '<span class="toast-icon">' + (toastIcons[type] || toastIcons.info) + '</span><span>' + msg + '</span>';
    // Force reflow for re-trigger animation
    void toastEl.offsetWidth;
    toastEl.classList.add('visible');
    toastTimer = setTimeout(function () { toastEl.classList.remove('visible'); }, 3000);
  }

  // Form submit
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var valid = true;

    if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
      emailField.classList.add('has-error');
      valid = false;
    }
    if (!password.value) {
      passwordField.classList.add('has-error');
      valid = false;
    }
    if (!valid) { showToast('Email dan password wajib diisi', 'danger'); return; }

    btnLogin.classList.add('loading');
    btnLogin.disabled = true;

    setTimeout(function () {
      btnLogin.classList.remove('loading');
      btnLogin.disabled = false;
      showToast('Login berhasil!', 'success');
      setTimeout(function () { window.location.href = 'dashboard.html'; }, 800);
    }, 1800);
  });

  // Stub links
  document.getElementById('forgotLink').addEventListener('click', function (e) {
    e.preventDefault();
    showToast('Password reset flow — coming soon', 'warning');
  });
  document.getElementById('createLink').addEventListener('click', function (e) {
    e.preventDefault();
    showToast('Account creation — coming soon', 'info');
  });
})();
</script>

</body>
</html>
